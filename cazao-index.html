<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<title>Login</title>

<style>

.container{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

body{
background-image:url('img/back.jpg');
background-position:center;
background-size:100rem;
}

</style>

</head>

<body>

<div class="container">

<form style="border-radius:25px;padding:25px;background-color:beige;box-shadow:0px 4px 15px rgba(0,0,0,0.5);" 
action="estoque" method="get">

<div class="mb-3">

<label class="email-login">Email do funcionário</label>

<input type="text"
name="email"
class="form-control"
style="width:350px;">

<div class="form-text">Use o email corporativo.</div>

</div>

<div class="mb-3">

<label class="form-label">Senha</label>

<input type="password"
name="senha"
class="form-control">

</div>

<button type="submit" class="btn btn-primary">Login</button>

</form>

</div>

</body>
</html>
